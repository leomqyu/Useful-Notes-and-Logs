name: Temporary HW2 CIFAR data prep

on:
  push:
    branches: [tmp-hw2-cifar-data]
    paths:
      - '.github/workflows/tmp_hw2_cifar.yml'
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and preprocess official CIFAR-10
        shell: bash
        run: |
          python -m pip install --quiet numpy
          python - <<'PY'
          import hashlib, pickle, tarfile, urllib.request
          from pathlib import Path
          import numpy as np

          url = "https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz"
          archive = Path("cifar-10-python.tar.gz")
          urllib.request.urlretrieve(url, archive)
          md5 = hashlib.md5(archive.read_bytes()).hexdigest()
          expected = "c58f30108f718f92721af3b95e74349a"
          if md5 != expected:
              raise RuntimeError(f"bad CIFAR archive md5: {md5}")

          with tarfile.open(archive, "r:gz") as tf:
              for name in [
                  "cifar-10-batches-py/data_batch_1",
                  "cifar-10-batches-py/test_batch",
              ]:
                  tf.extract(name, ".")

          def load(path, count):
              with open(path, "rb") as f:
                  obj = pickle.load(f, encoding="bytes")
              x = obj[b"data"][:count].reshape(-1, 3, 32, 32).astype(np.float32)
              gray = 0.299*x[:,0] + 0.587*x[:,1] + 0.114*x[:,2]
              gray8 = gray.reshape(len(gray), 8, 4, 8, 4).mean(axis=(2,4))
              return np.rint(gray8).clip(0,255).astype(np.uint8)

          train = load("cifar-10-batches-py/data_batch_1", 2000)
          test = load("cifar-10-batches-py/test_batch", 1000)
          np.savez_compressed(
              "cifar10_8x8_subset.npz",
              train_u8=train,
              test_u8=test,
              source=np.array(["official CIFAR-10 python archive"]),
              archive_md5=np.array([md5]),
          )
          print("train", train.shape, "test", test.shape, "md5", md5)
          PY

      - name: Upload preprocessed subset
        uses: actions/upload-artifact@v4
        with:
          name: cifar10-8x8-hw2
          path: cifar10_8x8_subset.npz
          retention-days: 1
