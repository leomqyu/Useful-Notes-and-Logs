name: Temporary HW2 CIFAR data prep

on:
  push:
    branches: [tmp-hw2-cifar-data]
    paths:
      - '.github/workflows/tmp_hw2_cifar.yml'
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and preprocess CIFAR-10 binary archive
        shell: bash
        run: |
          python -m pip install --quiet numpy
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 240             https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-binary.tar.gz             -o cifar-10-binary.tar.gz
          echo "c32a1d4ab5d03f1284b67883e8d87530  cifar-10-binary.tar.gz" | md5sum -c -
          tar xzf cifar-10-binary.tar.gz
          python - <<'PY'
          from pathlib import Path
          import numpy as np

          def load(path, count):
              raw = np.fromfile(path, dtype=np.uint8).reshape(-1, 3073)[:count]
              x = raw[:, 1:].reshape(-1, 3, 32, 32).astype(np.float32)
              gray = 0.299*x[:,0] + 0.587*x[:,1] + 0.114*x[:,2]
              gray8 = gray.reshape(len(gray), 8, 4, 8, 4).mean(axis=(2,4))
              return np.rint(gray8).clip(0,255).astype(np.uint8)

          train = load("cifar-10-batches-bin/data_batch_1.bin", 2000)
          test = load("cifar-10-batches-bin/test_batch.bin", 1000)
          np.savez_compressed(
              "cifar10_8x8_subset.npz",
              train_u8=train,
              test_u8=test,
              source=np.array(["official CIFAR-10 binary archive via BrainChip mirror"]),
              archive_md5=np.array(["c32a1d4ab5d03f1284b67883e8d87530"]),
          )
          print("train", train.shape, "test", test.shape)
          PY

      - name: Upload preprocessed subset
        uses: actions/upload-artifact@v4
        with:
          name: cifar10-8x8-hw2
          path: cifar10_8x8_subset.npz
          retention-days: 1
