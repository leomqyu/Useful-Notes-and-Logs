name: Temporary HW2 CIFAR cache

on:
  push:
    branches: ["tmp-hw2-cifar-cache-20261005"]
    paths: [".github/workflows/tmp-hw2-cifar-cache.yml"]

permissions:
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build CIFAR-10 8x8 grayscale cache
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow
          python - <<'PY'
          import hashlib, pickle, tarfile, urllib.request
          from pathlib import Path
          import numpy as np
          from PIL import Image

          url = "https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz"
          expected = "c32a1d4ab5d03f1284b67883e8d87530"
          tgz = Path("cifar-10-python.tar.gz")
          urllib.request.urlretrieve(url, tgz)
          md5 = hashlib.md5(tgz.read_bytes()).hexdigest()
          assert md5 == expected, (md5, expected)

          with tarfile.open(tgz, "r:gz") as tf:
              tf.extractall("cifar_raw")
          base = Path("cifar_raw/cifar-10-batches-py")

          def load_batch(path):
              with open(path, "rb") as f:
                  d = pickle.load(f, encoding="bytes")
              return d[b"data"].reshape(-1,3,32,32).transpose(0,2,3,1)

          train = np.concatenate([load_batch(base/f"data_batch_{i}") for i in range(1,6)], axis=0)[:6000]
          test = load_batch(base/"test_batch")[:1000]

          def convert(arr):
              out = np.empty((len(arr), 8, 8), dtype=np.uint8)
              for i, rgb in enumerate(arr):
                  gray = np.clip(
                      0.299*rgb[:,:,0] + 0.587*rgb[:,:,1] + 0.114*rgb[:,:,2],
                      0, 255
                  ).astype(np.uint8)
                  out[i] = np.asarray(
                      Image.fromarray(gray, mode="L").resize((8,8), Image.Resampling.BILINEAR)
                  )
              return out

          Path("artifact").mkdir(exist_ok=True)
          np.savez_compressed(
              "artifact/cifar10_8x8_subset.npz",
              train_u8=convert(train),
              test_u8=convert(test),
          )
          print("cache bytes", Path("artifact/cifar10_8x8_subset.npz").stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hw2-cifar-cache
          path: artifact/cifar10_8x8_subset.npz
          retention-days: 1
